name: Deploy Backend to Alibaba Cloud SAE

on:
  workflow_dispatch:

env:
  REGION: cn-beijing

jobs:
  read-instance-logs:
    runs-on: ubuntu-latest
    steps:
      - name: Install Alibaba Cloud CLI
        run: |
          curl -sSL https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz -o aliyun-cli.tgz
          tar -xzf aliyun-cli.tgz
          sudo mv aliyun /usr/local/bin/
          aliyun version

      - name: Configure Alibaba Cloud CLI
        run: |
          aliyun configure set \
            --profile default \
            --mode AK \
            --region "$REGION" \
            --access-key-id "$ALIYUN_ACCESS_KEY_ID" \
            --access-key-secret "$ALIYUN_ACCESS_KEY_SECRET"
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}

      - name: Read SAE instance logs
        run: |
          set -euo pipefail

          groups="$(mktemp)"
          aliyun sae DescribeApplicationGroups \
            --AppId "$SAE_APP_ID" \
            --cli-output json > "$groups"

          echo "### Application groups"
          jq . "$groups"

          group_ids="$(jq -r '
            [.. | objects | to_entries[]
              | select((.key | ascii_downcase) == "groupid")
              | .value | strings] | unique | .[]
          ' "$groups")"
          if [ -z "$group_ids" ]; then
            echo "No application groups found" >&2
            exit 1
          fi

          instances="$(mktemp)"
          while IFS= read -r group_id; do
            echo "### Instances in group $group_id"
            aliyun sae DescribeApplicationInstances \
              --AppId "$SAE_APP_ID" \
              --GroupId "$group_id" \
              --cli-output json > "$instances"
            jq . "$instances"

            instance_ids="$(jq -r '
              [.. | objects | to_entries[]
                | select((.key | ascii_downcase) == "instanceid")
                | .value | strings] | unique | .[]
            ' "$instances")"
            while IFS= read -r instance_id; do
              echo "### Logs for instance $instance_id"
              response="$(mktemp)"
              if aliyun sae DescribeInstanceLog \
                --InstanceId "$instance_id" \
                --cli-output json > "$response"; then
                jq . "$response"
                jq -r '.Data // empty' "$response"
              else
                echo "Failed to read logs for instance $instance_id" >&2
              fi
            done <<< "$instance_ids"
          done <<< "$group_ids"
        env:
          SAE_APP_ID: ${{ secrets.SAE_APP_ID }}
