name: Deploy Backend to Alibaba Cloud SAE

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

env:
  SAE_REGION: cn-beijing
  RDS_REGION: cn-hangzhou

jobs:
  debug-rds-read-only:
    runs-on: ubuntu-latest
    steps:
      - name: Install Alibaba Cloud CLI
        run: |
          curl -sSL https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz -o aliyun-cli.tgz
          tar -xzf aliyun-cli.tgz
          sudo mv aliyun /usr/local/bin/
          aliyun version

      - name: Configure Alibaba Cloud CLI
        run: |
          aliyun configure set \
            --profile default \
            --mode AK \
            --region "$SAE_REGION" \
            --access-key-id "$ALIYUN_ACCESS_KEY_ID" \
            --access-key-secret "$ALIYUN_ACCESS_KEY_SECRET"
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}

      - name: Inspect ManjuFlow RDS instance and backups
        run: |
          set +e
          echo "### DescribeDBInstances"
          aliyun rds DescribeDBInstances --RegionId "$RDS_REGION" --PageSize 50
          echo "### DescribeDBInstanceAttribute"
          aliyun rds DescribeDBInstanceAttribute --DBInstanceId rm-bp1e54v694662tu61
          echo "### DescribeBackupPolicy"
          aliyun rds DescribeBackupPolicy --DBInstanceId rm-bp1e54v694662tu61
          echo "### DescribeBackups"
          aliyun rds DescribeBackups --DBInstanceId rm-bp1e54v694662tu61 --PageSize 10
        env:
          RDS_REGION: ${{ env.RDS_REGION }}
